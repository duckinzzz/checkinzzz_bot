services:
  bot:
    build:
      context: .
      target: dev
    # ВАЖНО: --ignore-paths задаётся ОДНИМ флагом через запятую. Повторять флаг
    # нельзя: у него нет action=append, argparse оставит только последнее значение.
    # data/ в списке обязательно: бот пишет туда state.json на каждой отметке,
    # и без этого хот-релоад перезапускал бы его посреди пары.
    command: sh -c "watchfiles --ignore-paths '.venv,.idea,data,.pytest_cache' 'python run.py' ."
    env_file:
      - .env
    volumes:
      - .:/app
      - /app/.venv  # preserve built venv (bind mount would clobber it otherwise)
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "1"
