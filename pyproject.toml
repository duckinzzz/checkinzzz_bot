[project]
name = "aiogram_template"
version = "0.1.0"
description = "Aiogram bot template"
requires-python = ">=3.13"
dependencies = [
    "aiogram==3.24.0",
    "gspread>=6.2.1",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "watchfiles>=1.1.1",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.pyright]
venvPath = "."
venv = ".venv"
